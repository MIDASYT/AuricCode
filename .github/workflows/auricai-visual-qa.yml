name: AuricAI web visual QA
on:
  push:
    branches: [main]
    paths:
      - 'dist/auricai/index.html'
      - 'dist/auricai/auricai.css'
      - 'dist/auricai/auricai.js'
      - 'dist/auricai/assets/**'
      - '.github/workflows/auricai-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check page resources and responsive layout
        run: |
          npm install --no-audit --no-fund --no-save playwright
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/auricai-qa.log 2>&1 &
          mkdir -p screenshots
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
          for(const d of [{name:'desktop',width:1440,height:900,mobile:false},{name:'android',width:390,height:844,mobile:true}]){
            const page=await browser.newPage({viewport:{width:d.width,height:d.height},isMobile:d.mobile,hasTouch:d.mobile,deviceScaleFactor:1});
            await page.goto('http://127.0.0.1:8765/auricai/',{waitUntil:'networkidle'});
            const imgs=await page.locator('img').evaluateAll(nodes=>nodes.map(n=>({src:n.getAttribute('src'),complete:n.complete,width:n.naturalWidth})));
            if(imgs.some(x=>!x.complete||x.width===0))throw Error('Broken image ('+d.name+'): '+JSON.stringify(imgs));
            const viewportOk=await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1);
            if(!viewportOk)throw Error('Unexpected horizontal overflow on '+d.name);
            const buttons=await page.locator('[data-download]').count();
            if(buttons!==2)throw Error('Expected exactly two native installer links');
            await page.screenshot({path:'screenshots/auricai-web-'+d.name+'.png',fullPage:true});
            await page.close();
          }
          await browser.close();
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: AuricAI-web-real-browser-screenshots
          path: screenshots/
          retention-days: 30
