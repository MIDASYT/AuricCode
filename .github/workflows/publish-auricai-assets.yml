name: Publicar descargas publicas de AuricAI (una sola vez)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-auricai-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Obtener instaladores privados ya compilados y firmados
        shell: bash
        env:
          AURICAI_WIN_ZIP: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-0d20-820e-9dec-de2adff3dc57/raw?se=2026-11-06T03%3A03%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=0f83cc35-7b1a-5b04-88b9-baa05eba58da&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-05T12%3A23%3A57Z&ske=2026-11-06T12%3A23%3A57Z&sks=b&skv=2026-02-06&sig=o9DMYT/Xt%2Bs5BqCsEOJrykUPIewPGX8aVo4hBNMqzd0%3D'
          AURICAI_ANDROID_ZIP: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-dc98-820e-b2c9-3b465c2d8c35/raw?se=2026-11-06T03%3A03%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=89d3680d-ea54-5b06-b712-dc9d57402a08&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-05T12%3A00%3A47Z&ske=2026-11-06T12%3A00%3A47Z&sks=b&skv=2026-02-06&sig=iWBlE3KIvYsEXfJYKzoa0Z9tQP%2B0kFmlLPZGP229SRo%3D'
        run: |
          set -euo pipefail
          mkdir -p dist/auricai/downloads
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 240 --silent --show-error "$AURICAI_WIN_ZIP" -o /tmp/windows.zip
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 240 --silent --show-error "$AURICAI_ANDROID_ZIP" -o /tmp/android.zip
          unzip -j -o /tmp/windows.zip -d dist/auricai/downloads/
          unzip -j -o /tmp/android.zip -d dist/auricai/downloads/
          cd dist/auricai/downloads
          echo "f9802457ff31600e43adc0ba4ccfdba1e42d3c24270f435755fcb2b584461e2e  AuricAI_0.1.0_x64-setup.exe" | sha256sum --check
          echo "b327a2708f10237831d7731bca0cbf0f5dd608433da04e5ff814d0e27b061381  AuricAI-0.1.0-Android-ARM64-test.apk" | sha256sum --check
      - name: Escribir manifiesto de descargas
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=Path('dist/auricai/downloads')
          def item(name, hash):
              return {'file':name,'sha256':hash,'bytes':(d/name).stat().st_size}
          data={'version':'0.1.0','channel':'technical-preview','firebaseConfigured':False,'gatewayConfigured':False,
              'windows':item('AuricAI_0.1.0_x64-setup.exe','f9802457ff31600e43adc0ba4ccfdba1e42d3c24270f435755fcb2b584461e2e'),
              'android':item('AuricAI-0.1.0-Android-ARM64-test.apk','b327a2708f10237831d7731bca0cbf0f5dd608433da04e5ff814d0e27b061381')}
          Path('dist/auricai/release.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Guardar archivos de descarga en el repositorio publico
        run: |
          git config user.name "auric-build[bot]"
          git config user.email "auric-build[bot]@users.noreply.github.com"
          git add dist/auricai/downloads dist/auricai/release.json
          git diff --cached --quiet || (git commit -m "Publish verified AuricAI Windows EXE and Android test APK" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
