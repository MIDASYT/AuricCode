name: AuricCode — publish live website to shared Firebase project
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.AURIC_FIREBASE_PROJECT_ID }}
      HAS_HOSTING_CREDENTIALS: ${{ secrets.FIREBASE_HOSTING_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment configuration without printing credentials
        shell: bash
        run: |
          if [[ -z "$PROJECT_ID" || "$HAS_HOSTING_CREDENTIALS" != "true" ]]; then
            echo "::error::Shared Firebase Hosting is not configured; this cannot be marked deployed." >&2
            exit 1
          fi
      - name: Gate Hosting on published stable AuricCode 0.18 or newer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('dist/release.json'))
          version=d.get('version','0.0.0')
          if tuple(map(int,version.split('.'))) < (0,18,0):
              raise SystemExit('Stable AuricCode 0.18 not yet published; no Firebase Hosting deployment.')
          if not d.get('installerUrl','').startswith('https://github.com/MIDASYT/AuricCode/releases/download/'):
              raise SystemExit('Installer is not published as an official GitHub Release')
          PY
      - name: Deploy validated site to Firebase live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_HOSTING_SERVICE_ACCOUNT }}
          projectId: ${{ env.PROJECT_ID }}
          channelId: live
      - name: Check actual Firebase site after publication
        if: env.PROJECT_ID != '' && env.HAS_HOSTING_CREDENTIALS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          html="$(mktemp)"
          response="$(curl -L -sS --max-time 30 -o "$html" -w '%{http_code}' 'https://auric-code.web.app/')"
          test "$response" = 200
          grep -qi 'AuricCode' "$html"
