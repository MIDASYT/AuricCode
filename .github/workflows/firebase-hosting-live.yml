name: AuricCode — publish live website to shared Firebase project
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.AURIC_FIREBASE_PROJECT_ID }}
      HAS_HOSTING_CREDENTIALS: ${{ secrets.FIREBASE_HOSTING_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment configuration without printing credentials
        shell: bash
        run: |
          if [[ -z "$PROJECT_ID" || "$HAS_HOSTING_CREDENTIALS" != "true" ]]; then
            echo "::error::Shared Firebase Hosting is not configured; this cannot be marked deployed." >&2
            exit 1
          fi
      - name: Verify website content and independent download status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path('dist/')
          assert (base/'index.html').exists() and (base/'instalar.html').exists()
          assert (base/'style.css').exists() and (base/'app.js').exists()
          manifest=json.loads((base/'release.json').read_text())
          assert isinstance(manifest.get('version'),str)
          # La web sí puede publicarse antes que el instalador; no anunciar descargas privadas.
          if manifest.get('publicDownloads') is not True:
              print('Sitio publicable con descargas suspendidas hasta canal público verificable')
          PY
      - name: Deploy validated site to Firebase live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_HOSTING_SERVICE_ACCOUNT }}
          projectId: ${{ env.PROJECT_ID }}
          channelId: live
      - name: Check actual Firebase site after publication
        if: env.PROJECT_ID != '' && env.HAS_HOSTING_CREDENTIALS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          html="$(mktemp)"
          response="$(curl -L -sS --max-time 30 -o "$html" -w '%{http_code}' 'https://auric-code-web.web.app/')"
          test "$response" = 200
          grep -qi 'AuricCode' "$html"
