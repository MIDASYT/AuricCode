name: Publish AuricAI 0.1.1 preview installers once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-publish-auricai-011.yml']
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download signed verified native previews
        shell: bash
        env:
          WINDOWS_ZIP: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-fc74-820e-b1d8-a64b8317435f/raw?se=2026-11-06T20%3A15%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=04b9d8c1-6af6-5803-b4b9-9c04656bb97f&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-06T18%3A12%3A33Z&ske=2026-11-07T18%3A12%3A33Z&sks=b&skv=2026-02-06&sig=2rSp58Pd/jcat3Pj0eVucOUAh%2BKklTg3kqtppFy0vE8%3D'
          ANDROID_ZIP: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-b92c-820e-a093-1f308fa68094/raw?se=2026-11-06T20%3A15%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=0f87d912-5466-5104-8b95-a4b42ff52ba3&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-06T18%3A17%3A02Z&ske=2026-11-07T18%3A17%3A02Z&sks=b&skv=2026-02-06&sig=eAzpEagedfKgzPR%2BN/7bLrfI3HUPifdCM6ONvsqC858%3D'
        run: |
          set -euo pipefail
          mkdir -p dist/auricai/downloads
          curl -fLsS --retry 2 --max-time 180 "$WINDOWS_ZIP" -o /tmp/auric-win.zip
          curl -fLsS --retry 2 --max-time 180 "$ANDROID_ZIP" -o /tmp/auric-android.zip
          unzip -jo /tmp/auric-win.zip -d dist/auricai/downloads/
          unzip -jo /tmp/auric-android.zip -d dist/auricai/downloads/
          cd dist/auricai/downloads
          echo 'a095dd703b30f2a71abed22e09bbdf9a051ce86464c16360dc0f2ebfec2b0fb4  AuricAI_0.1.1_x64-setup.exe' | sha256sum -c -
          echo '44cd08b5050bd564cbe302e13f945c21f7532ca5123e33d7f3e7c96769609347  AuricAI-0.1.1-Android-ARM64-test.apk' | sha256sum -c -
      - name: Update public release manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          folder=Path('dist/auricai/downloads')
          files={'windows':('AuricAI_0.1.1_x64-setup.exe','a095dd703b30f2a71abed22e09bbdf9a051ce86464c16360dc0f2ebfec2b0fb4'),
                 'android':('AuricAI-0.1.1-Android-ARM64-test.apk','44cd08b5050bd564cbe302e13f945c21f7532ca5123e33d7f3e7c96769609347')}
          data={'version':'0.1.1','channel':'technical-preview','firebaseConfigured':False,'gatewayConfigured':False}
          for key,(file,sha) in files.items(): data[key]={'file':file,'sha256':sha,'bytes':(folder/file).stat().st_size}
          Path('dist/auricai/release.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Commit public assets while keeping 0.1.0 history
        run: |
          git config user.name 'auric-build[bot]'
          git config user.email 'auric-build[bot]@users.noreply.github.com'
          git add dist/auricai/downloads/ dist/auricai/release.json
          git diff --cached --quiet || (git commit -m 'Publish official AuricAI 0.1.1 native preview installers' && git push)
